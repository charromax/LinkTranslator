name: Android release

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: publish signed release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Determine release metadata
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable releases require a vX.Y.Z tag." >&2
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version_name=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "title=Polyglot ${tag#v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            short_sha="${GITHUB_SHA:0:7}"
            echo "tag=ci-$short_sha" >> "$GITHUB_OUTPUT"
            echo "version_name=0.0.0-ci.${GITHUB_RUN_NUMBER}+$short_sha" >> "$GITHUB_OUTPUT"
            echo "title=Polyglot tester build $short_sha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode upload keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Release signing is not configured." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/polyglot-upload.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Test and build signed release artifacts
        env:
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ steps.keystore.outputs.path }}
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseVersionCode: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_releaseVersionName: ${{ steps.release.outputs.version_name }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          mkdir -p release-assets
          version="${{ steps.release.outputs.version_name }}"
          apk_path="release-assets/Polyglot-$version.apk"
          aab_path="release-assets/Polyglot-$version.aab"
          cp app/build/outputs/apk/release/app-release.apk "$apk_path"
          cp app/build/outputs/bundle/release/app-release.aab "$aab_path"
          echo "apk=$apk_path" >> "$GITHUB_OUTPUT"
          echo "aab=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          APK_PATH: ${{ steps.assets.outputs.apk }}
          AAB_PATH: ${{ steps.assets.outputs.aab }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" "$AAB_PATH" --clobber
          elif [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" "$APK_PATH" "$AAB_PATH" \
              --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --prerelease --generate-notes
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" "$AAB_PATH" \
              --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --generate-notes
          fi

      - name: Remove upload keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/polyglot-upload.jks"
